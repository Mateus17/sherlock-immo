<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sherlock Immo : une loupe de détective dont l'anneau reprend les 7 couleurs
       de l'étiquette énergie (A → G), posée sur une maison. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25305a" />
      <stop offset="1" stop-color="#111733" />
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9964a" />
      <stop offset="1" stop-color="#8a4f1c" />
    </linearGradient>
  </defs>

  <rect id="fond" width="512" height="512" rx="112" fill="url(#bg)" />

  <g id="motif">
  <!-- Décalage pour centrer loupe + manche dans le carré -->
  <g transform="translate(22 22)">
    <!-- Manche (bois, façon pipe de Sherlock) -->
    <g transform="rotate(-45 216 216)">
      <rect x="194" y="320" width="44" height="66" rx="8" fill="#cfd6e6" />
      <rect x="191" y="380" width="50" height="104" rx="25" fill="url(#wood)" />
    </g>

    <!-- Lentille -->
    <circle cx="216" cy="216" r="122" fill="#0d1229" />
    <circle cx="216" cy="216" r="122" fill="url(#lens)" />

    <!-- Maison dans la lentille -->
    <g fill="#ffffff">
      <path d="M216 138 L300 210 L282 210 L282 288 L150 288 L150 210 L132 210 Z" />
    </g>
    <g fill="#0d1229">
      <rect x="198" y="236" width="36" height="52" rx="4" />
      <rect x="168" y="216" width="22" height="22" rx="3" />
      <rect x="242" y="216" width="22" height="22" rx="3" />
    </g>
    <!-- Cheminée -->
    <rect x="258" y="152" width="16" height="34" fill="#ffffff" />

    <!-- Anneau en jauge : 7 arcs A → G sur 320°, ouverts à l'endroit du manche.
         Circonférence 2π·138 ≈ 867 ; arc de 42,7° ≈ 102,9 ; départ à 155° du haut. -->
    <g fill="none" stroke-width="30">
      <circle cx="216" cy="216" r="138" stroke="#009c6d" stroke-dasharray="102.9 764.2" transform="rotate(65.0 216 216)" />
      <circle cx="216" cy="216" r="138" stroke="#52b153" stroke-dasharray="102.9 764.2" transform="rotate(110.71 216 216)" />
      <circle cx="216" cy="216" r="138" stroke="#a5cc74" stroke-dasharray="102.9 764.2" transform="rotate(156.43 216 216)" />
      <circle cx="216" cy="216" r="138" stroke="#f4e70f" stroke-dasharray="102.9 764.2" transform="rotate(202.14 216 216)" />
      <circle cx="216" cy="216" r="138" stroke="#f0b40f" stroke-dasharray="102.9 764.2" transform="rotate(247.86 216 216)" />
      <circle cx="216" cy="216" r="138" stroke="#eb8235" stroke-dasharray="102.9 764.2" transform="rotate(293.57 216 216)" />
      <circle cx="216" cy="216" r="138" stroke="#d7221f" stroke-dasharray="102.9 764.2" transform="rotate(339.29 216 216)" />
    </g>

    <!-- Reflet sur le verre -->
    <path d="M140 170 A92 92 0 0 1 196 118" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="9" stroke-linecap="round" />
  </g>
  </g>
</svg>
