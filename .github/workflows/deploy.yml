# Construit le site et le publie sur GitHub Pages : à chaque push sur main, et après chaque
# construction des données hébergées (donnees.yml l'appelle).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Lien « code source » affiché sur la page Sources et outils
          VITE_REPO_URL: https://github.com/${{ github.repository }}
      # Données hébergées (maisons) : dernière archive construite par donnees.yml.
      # Absente (fork tout neuf) : le site fonctionne quand même, via l'API de l'ADEME.
      - name: Ajouter les données hébergées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download donnees --repo "${{ github.repository }}" --pattern donnees.tar --dir /tmp; then
            tar -xf /tmp/donnees.tar -C dist
            du -sh dist/donnees
          else
            echo "Pas encore de données hébergées : le site utilisera l'API de l'ADEME."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
