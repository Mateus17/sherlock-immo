# Mises à jour automatiques, regroupées pour limiter le bruit
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # vue-tsc ne fonctionne pas encore avec TypeScript 7 (réécriture native) : on reste en 6.x
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dependances:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
